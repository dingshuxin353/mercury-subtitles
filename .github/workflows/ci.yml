name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify:generated
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --maxWorkers=1 --no-file-parallelism
      - run: npm run verify:package
      - run: npm run verify:sensitive
      - run: npm run verify:public-snapshot
