name: 功能建议
description: 建议新的用户能力或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 请描述用户问题，而不是粘贴私人素材、凭据或 Provider 响应。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望的用户结果
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 主要使用方式
      options:
        - CLI / App
        - Agent Skill
        - 两者都有
        - 不确定
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前如何绕过
