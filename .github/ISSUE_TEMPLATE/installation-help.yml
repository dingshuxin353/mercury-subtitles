name: 安装 / 配置帮助
description: Node、npm、命令发现或模型配置问题
title: "[Help] "
labels: ["help wanted"]
body:
  - type: markdown
    attributes:
      value: |
        不要粘贴 Key、Token、ADC 内容、.env、私有音频或完整日志。Mercury 的密钥应只在交互 App 的隐藏输入中填写。
  - type: input
    id: platform
    attributes:
      label: 系统与终端
      placeholder: macOS；zsh
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Node、npm、Mercury 版本
      placeholder: Node v24.x.x；npm 11.x；Mercury 0.2.0-alpha.2
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: 卡在哪一步
      options:
        - 安装 Node 24
        - npm 安装
        - 找不到 mercury 命令
        - 首次设置 / 模型中心
        - 模型检查
        - 后台任务 / Worker
        - Skill 安装或发现
        - 其他
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 脱敏后的错误和已尝试操作
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有提交任何凭据、私人媒体、完整字幕或 Provider 原始响应。
          required: true
